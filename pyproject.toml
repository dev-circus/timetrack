[project]
name = "timetrack"
version = "0.1.0"
description = "Projektbezogene Zeiterfassung: CLI, Norton-Commander-TUI und MCP-Server für Claude"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "rich>=13",
]

[project.scripts]
timetrack = "timetrack.cli:main"
timetrack-mcp = "timetrack.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timetrack"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
